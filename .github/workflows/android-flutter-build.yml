name: Android Flutter Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android runtime build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            bzip2 \
            ca-certificates \
            curl \
            diffutils \
            flex \
            gawk \
            gzip \
            patch \
            pkg-config \
            tar \
            unzip \
            xz-utils

      - name: Fetch Android runtime sources
        shell: pwsh
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build Android terminal runtime
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      - name: Upload Android terminal runtime
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/*/libbash.so
            apps/flutter/app/android/app/src/main/jniLibs/*/liboperit_busybox.so
            apps/flutter/app/android/app/src/main/jniLibs/*/liboperit_loader.so
            apps/flutter/app/android/app/src/main/jniLibs/*/liboperit_proot.so
            apps/flutter/app/android/app/src/main/assets/android-runtime/*/rootfs.tar.gz.bin
            apps/flutter/app/android/app/src/main/assets/android-runtime/*/rootfs.tar.gz.bin.sha256
          if-no-files-found: error
          retention-days: 1

  build-android:
    needs: build-android-runtime
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.1.2
      TYPESCRIPT_VERSION: 5.9.3
      WASM_BINDGEN_VERSION: 0.2.122
      WASI_SDK_VERSION: "20.0"
      QUICKJS_WASM_SYS_WASI_SDK_MAJOR_VERSION: 20
      QUICKJS_WASM_SYS_WASI_SDK_MINOR_VERSION: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android terminal runtime
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: apps/flutter/app/android/app/src/main

      - name: Install bootstrap Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm and install plugin buildin dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.7.0 --activate
          pnpm --version
          Push-Location plugins/packages/buildin/workflow
          pnpm install --frozen-lockfile
          Pop-Location

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate self-signed debug keystore
        shell: pwsh
        run: |
          $store = Join-Path $env:GITHUB_WORKSPACE "operit2-local.keystore"
          keytool -genkeypair -v -keystore $store -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Operit2 Local Build"
          $props = "apps/flutter/app/android/local.properties"
          Add-Content -Path $props -Value "RELEASE_STORE_FILE=$($store.Replace('\','/'))"
          Add-Content -Path $props -Value "RELEASE_STORE_PASSWORD=android"
          Add-Content -Path $props -Value "RELEASE_KEY_ALIAS=androiddebugkey"
          Add-Content -Path $props -Value "RELEASE_KEY_PASSWORD=android"

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,wasm32-unknown-unknown

      - name: Prepare Android bindgen libclang
        shell: pwsh
        run: |
          $version = "21.1.8"
          $packageName = "libclang.runtime.win-x64.$version"
          $toolsDir = "target/operit-build-tools"
          $packageDir = Join-Path $toolsDir $packageName
          $archive = Join-Path $toolsDir "$packageName.nupkg"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/libclang.runtime.win-x64/$version" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $packageDir -Force
          $libclang = Join-Path $packageDir "runtimes/win-x64/native/libclang.dll"
          if (-not (Test-Path -LiteralPath $libclang)) {
            throw "Android bindgen libclang was not prepared at $libclang"
          }

      - name: Check build environment
        shell: pwsh
        run: python tools/build_scripts/check_environment.py --products app --github-runner

      - name: Build Web Access assets
        shell: pwsh
        run: python tools/build_scripts/build_flutter_web_access.py --base-href /

      - name: Build and package Android app
        shell: pwsh
        run: |
          $version = (Select-String -Path apps/flutter/app/pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$').Matches
          if ($version.Count -ne 1) {
            throw "apps/flutter/app/pubspec.yaml must contain exactly one release version line"
          }
          $exit = 1
          foreach ($attempt in 1..3) {
            python tools/build_scripts/build_flutter_android.py --build-name $version[0].Groups[1].Value --build-number $version[0].Groups[2].Value --enforce-lockfile --skip-signing
            $exit = $LASTEXITCODE
            if ($exit -eq 0) { break }
            Write-Host "android build attempt $attempt failed; retrying after mirror backoff"
            Start-Sleep -Seconds (60 * $attempt)
          }
          if ($exit -ne 0) { throw "build_flutter_android.py failed after 3 attempts" }

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-${{ github.sha }}
          path: tools/release/dist/operit2-app-android-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APKs to a downloadable branch
        shell: pwsh
        run: |
          $outDir = "tool/apk-out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item tools/release/dist/operit2-app-android-*.apk $outDir
          $version = (Select-String -Path apps/flutter/app/pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$').Matches
          $tag = "apk-$($version[0].Groups[1].Value)"
          @"
          # APK build output

          Build: Operit2 $tag (commit ${{ github.sha }})
          Self-signed preview build. Install app-arm64-v8a-release.apk on arm64 devices.
          "@ | Set-Content -Path "$outDir/README.md" -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-dist
          git rm -rf --quiet . 2>$null
          Remove-Item -Recurse -Force * -ErrorAction SilentlyContinue
          Copy-Item "$outDir/*" . -Force
          git add -A
          git commit -m "Publish Android APKs for $tag"
          git push --force origin apk-dist
