name: Android Flutter Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Android runtime downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/operit-android-runtime/android-ndk-r29-beta4-linux.zip
            tools/android-runtime/downloads
          key: android-runtime-sources-${{ runner.os }}-${{ hashFiles('tools/android-runtime/fetch_sources.ps1', 'tools/android-runtime/fetch_ndk_wsl.sh') }}

      - name: Install Android runtime build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            bzip2 \
            ca-certificates \
            curl \
            diffutils \
            flex \
            gawk \
            gzip \
            patch \
            pkg-config \
            tar \
            unzip \
            xz-utils

      - name: Fetch Android runtime sources
        shell: pwsh
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build Android terminal runtime
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      - name: Upload Android terminal runtime
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/*/libbash.so
            apps/flutter/app/android/app/src/main/jniLibs/*/liboperit_busybox.so
            apps/flutter/app/android/app/src/main/jniLibs/*/liboperit_loader.so
            apps/flutter/app/android/app/src/main/jniLibs/*/liboperit_proot.so
            apps/flutter/app/android/app/src/main/assets/android-runtime/*/rootfs.tar.gz.bin
            apps/flutter/app/android/app/src/main/assets/android-runtime/*/rootfs.tar.gz.bin.sha256
          if-no-files-found: error
          retention-days: 1

  build-android:
    needs: build-android-runtime
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.1.2
      TYPESCRIPT_VERSION: 5.9.3
      WASM_BINDGEN_VERSION: 0.2.122
      WASI_SDK_VERSION: "20.0"
      QUICKJS_WASM_SYS_WASI_SDK_MAJOR_VERSION: 20
      QUICKJS_WASM_SYS_WASI_SDK_MINOR_VERSION: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Dart package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\Pub\Cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('apps/flutter/app/pubspec.lock') }}

      - name: Restore Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ci-tools/wasm-bindgen
          key: cargo-deps-${{ runner.os }}-${{ env.RUST_TOOLCHAIN_VERSION }}-${{ env.WASM_BINDGEN_VERSION }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Restore Cargo build output
        uses: actions/cache@v4
        with:
          path: |
            core/target
            apps/flutter/native/operit-flutter-bridge/target
          key: cargo-target-${{ runner.os }}-${{ env.RUST_TOOLCHAIN_VERSION }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Download Android terminal runtime
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: apps/flutter/app/android/app/src/main

      - name: Install bootstrap Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm and install plugin buildin dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.7.0 --activate
          pnpm --version
          Push-Location plugins/packages/buildin/workflow
          pnpm install --frozen-lockfile
          Pop-Location

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Android release signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'stop'
          foreach ($pair in @(
              @("ANDROID_RELEASE_KEYSTORE_BASE64", $env:KEYSTORE_BASE64),
              @("ANDROID_RELEASE_STORE_PASSWORD", $env:STORE_PASSWORD),
              @("ANDROID_RELEASE_KEY_ALIAS", $env:KEY_ALIAS),
              @("ANDROID_RELEASE_KEY_PASSWORD", $env:KEY_PASSWORD)
          )) {
              if ([string]::IsNullOrWhiteSpace($pair[1])) {
                  throw "Missing repository secret $($pair[0]); a stable signing key is required so updates install over the previous build"
              }
          }

          $store = Join-Path $env:RUNNER_TEMP "operit2-release.jks"
          [IO.File]::WriteAllBytes($store, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          Write-Host "Restored release keystore ($((Get-Item $store).Length) bytes) with alias $($env:KEY_ALIAS)"

          $props = "apps/flutter/app/android/local.properties"
          Add-Content -Path $props -Value "RELEASE_STORE_FILE=$($store.Replace('\','/'))"
          Add-Content -Path $props -Value "RELEASE_STORE_PASSWORD=$($env:STORE_PASSWORD)"
          Add-Content -Path $props -Value "RELEASE_KEY_ALIAS=$($env:KEY_ALIAS)"
          Add-Content -Path $props -Value "RELEASE_KEY_PASSWORD=$($env:KEY_PASSWORD)"

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,wasm32-unknown-unknown

      - name: Prepare Android bindgen libclang
        shell: pwsh
        run: |
          $version = "21.1.8"
          $packageName = "libclang.runtime.win-x64.$version"
          $toolsDir = "target/operit-build-tools"
          $packageDir = Join-Path $toolsDir $packageName
          $archive = Join-Path $toolsDir "$packageName.nupkg"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/libclang.runtime.win-x64/$version" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $packageDir -Force
          $libclang = Join-Path $packageDir "runtimes/win-x64/native/libclang.dll"
          if (-not (Test-Path -LiteralPath $libclang)) {
            throw "Android bindgen libclang was not prepared at $libclang"
          }

      - name: Check build environment
        shell: pwsh
        run: python tools/build_scripts/check_environment.py --products app --github-runner

      - name: Build Web Access assets
        shell: pwsh
        run: python tools/build_scripts/build_flutter_web_access.py --base-href /

      - name: Build and package Android app
        shell: pwsh
        run: |
          $version = (Select-String -Path apps/flutter/app/pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$').Matches
          if ($version.Count -ne 1) {
            throw "apps/flutter/app/pubspec.yaml must contain exactly one release version line"
          }
          $exit = 1
          foreach ($attempt in 1..3) {
            python tools/build_scripts/build_flutter_android.py --build-name $version[0].Groups[1].Value --build-number $version[0].Groups[2].Value --enforce-lockfile --skip-signing
            $exit = $LASTEXITCODE
            if ($exit -eq 0) { break }
            Write-Host "android build attempt $attempt failed; retrying after mirror backoff"
            Start-Sleep -Seconds (60 * $attempt)
          }
          if ($exit -ne 0) { throw "build_flutter_android.py failed after 3 attempts" }

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-${{ github.sha }}
          path: tools/release/dist/operit2-app-android-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APKs to a GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'stop'

          function Get-CargoVersion([string]$manifest) {
              $hit = Select-String -Path $manifest -Pattern '^version = "([^"]+)"' | Select-Object -First 1
              if (-not $hit) { throw "No version field found in $manifest" }
              return $hit.Matches[0].Groups[1].Value
          }

          $cliVersion = Get-CargoVersion "apps/cli/Cargo.toml"
          $runtimeVersion = Get-CargoVersion "core/crates/runtime/application/Cargo.toml"
          if ($cliVersion -ne $runtimeVersion) {
              throw "CLI version $cliVersion does not match runtime version $runtimeVersion"
          }
          if ($cliVersion.Contains("+")) {
              throw "Release version $cliVersion must not include build metadata"
          }

          $flutterMatch = (Select-String -Path "apps/flutter/app/pubspec.yaml" -Pattern '^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$').Matches
          if ($flutterMatch.Count -ne 1) {
              throw "apps/flutter/app/pubspec.yaml must contain exactly one release version line"
          }
          $releaseCore = $cliVersion -replace '-.*$', ''
          if ($flutterMatch[0].Groups[1].Value -ne $releaseCore) {
              throw "Flutter version $($flutterMatch[0].Groups[1].Value) does not match release version $releaseCore"
          }

          $assets = @()
          foreach ($name in @(
              "operit2-app-android-arm64-v8a.apk"
              "operit2-app-android-armeabi-v7a.apk"
              "operit2-app-android-x86_64.apk"
          )) {
              $path = Join-Path "tools/release/dist" $name
              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Missing release asset $name"
              }
              $assets += (Resolve-Path -LiteralPath $path).Path
          }

          $tag = "v$cliVersion"
          $prerelease = $cliVersion.Contains("-")
          $pages = gh api "repos/$env:GH_REPO/releases" --paginate --slurp | ConvertFrom-Json
          $existing = @($pages | ForEach-Object { $_ } | Where-Object { $_.tag_name -eq $tag }) | Select-Object -First 1

          if (-not $existing) {
              $notes = "Operit2 $cliVersion, commit ${{ github.sha }}.`nSelf-signed preview build. Install operit2-app-android-arm64-v8a.apk on arm64 devices."
              $createArgs = @("release", "create", $tag, "--repo", $env:GH_REPO, "--title", "Operit2 $cliVersion", "--notes", $notes)
              if ($prerelease) { $createArgs += "--prerelease" }
              & gh @createArgs
              if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          }
          elseif ([bool]$existing.prerelease -ne $prerelease) {
              throw "Release $tag has prerelease=$($existing.prerelease) but version $cliVersion requires prerelease=$prerelease"
          }

          $uploadArgs = @("release", "upload", $tag, "--repo", $env:GH_REPO, "--clobber") + $assets
          & gh @uploadArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
